    <!-- Trailing-slash normalization for GitHub Pages subpaths -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash);

      })();
    </script>

    <!-- Automatic bridge for unbuilt GitHub Pages root branch deployments -->
    <script>
      (function() {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var pathname = window.location.pathname;
        var isDocs = pathname.includes('/docs');

        // Check if this document contains uncompiled /src/main.tsx
        var scripts = document.getElementsByTagName('script');
        var hasDevScript = false;
        for (var i = 0; i < scripts.length; i++) {
          if (scripts[i].src && scripts[i].src.indexOf('main.tsx') !== -1) {
            hasDevScript = true;
            break;
          }
        }

        // If running unbundled source on a static host (like GitHub Pages branch deploy):
        if (hasDevScript && !isLocal && !isDocs) {
          var base = pathname.endsWith('/') ? pathname : pathname + '/';
          // Auto-redirect to the pre-compiled /docs/ distribution
          window.location.replace(base + 'docs/' + window.location.search + window.location.hash);
        }
      })();
    </script>

            '<div style="background:#ffffff;padding:16px;border-radius:14px;border:1px solid #fef3c7;font-size:13px;line-height:1.7;color:#1c1917;margin-bottom:16px;">' +
            '<strong style="color:#153e26;font-size:14px;">Option A (Fastest - 10 Seconds):</strong><br>' +

            '</div>' +

            '<strong style="color:#153e26;font-size:14px;">Option B (GitHub Actions - Automated):</strong><br>' +
            '1. Go to GitHub Repo → <strong>Settings</strong> → <strong>Pages</strong>.<br>' +
            '2. Change <em>Source</em> from <em>Deploy from a branch</em> to <strong>"GitHub Actions"</strong>.<br>' +
